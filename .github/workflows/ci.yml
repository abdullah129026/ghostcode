name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/ -q
      # Pyflakes gate, mirroring the PRISM/Spec2Run backends. The fixtures
      # under backend/ingest/fixtures are intentionally dead code (the
      # detector's test corpus), so they are excluded from the gate.
      - run: pip install ruff==0.17.1
      - run: ruff check backend/ --select F --exclude "backend/ingest/fixtures/*"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
